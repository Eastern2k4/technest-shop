spring.datasource.url=jdbc:h2:mem:technest-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
debug=false
spring.main.log-startup-info=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

logging.level.root=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.boot.web.servlet=WARN
logging.level.org.springframework.boot.web.servlet.ServletContextInitializerBeans=WARN
logging.level.org.springframework.boot.actuate.endpoint.web.servlet=WARN
logging.level.org.springframework.boot.actuate.endpoint.web.servlet.WebMvcEndpointHandlerMapping=WARN
logging.level.org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger=OFF
logging.level.com.example.ecommerce.security.JwtAuthFilter=WARN
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.jwt.secret=test-jwt-secret-for-spring-boot-tests-2026-test-jwt-secret-2026
app.jwt.ttl-seconds=604800
app.auth.rate-limit.max-attempts=2
app.auth.rate-limit.block-seconds=300
