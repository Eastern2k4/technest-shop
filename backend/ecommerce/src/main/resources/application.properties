spring.application.name=Ecommerce
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ecommerce_slim?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.level.com.example.ecommerce.security.JwtAuthFilter=${JWT_AUTH_FILTER_LOG_LEVEL:WARN}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
app.jwt.secret=${APP_JWT_SECRET:change-this-jwt-secret-in-env-change-this-jwt-secret-in-env-2026}
app.jwt.ttl-seconds=${APP_JWT_TTL_SECONDS:604800}
app.auth.rate-limit.max-attempts=${APP_AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
app.auth.rate-limit.block-seconds=${APP_AUTH_RATE_LIMIT_BLOCK_SECONDS:900}

# Email configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.email.from=${MAIL_FROM:no-reply@technest.local}
